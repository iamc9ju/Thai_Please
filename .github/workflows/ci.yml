name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: thai_please_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d thai_please_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_PREFIX: api
      APP_NAME: thai-please-api
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://test:test-only-password@127.0.0.1:5432/thai_please_test?schema=public
      ENABLE_SWAGGER: 'false'
      NODE_ENV: test
      PORT: 3000
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
